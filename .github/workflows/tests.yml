name: CI Tests

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    backend:
        name: Backend Tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: socialanimal_ci_test
                ports: ["5432:5432"]
                options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        env:
            TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/socialanimal_ci_test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/socialanimal_ci_test
            JWT_SECRET: ci-only
            CREDENTIAL_ENCRYPTION_KEY: abababababababababababababababababababababababababababababababab

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: ./backend
              run: npm ci

            - name: Generate Prisma Client
              working-directory: ./backend
              run: npx prisma generate

            - name: Run linter
              working-directory: ./backend
              run: npm run lint -- --max-warnings=0

            - name: Initialize an empty database
              working-directory: ./backend
              run: npm run build && node tests/database/fresh.mjs

            - name: Run tests
              working-directory: ./backend
              run: npm test

            - name: Check generated API client
              working-directory: ./backend
              run: npm run client:generate && git diff --exit-code -- ../docs/openapi.json ../frontend/lib/generated/client.ts

            - name: Build
              working-directory: ./backend
              run: npm run build

            - name: Verify database backup restoration
              working-directory: ./backend
              env:
                  TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
              run: node tests/database/restore.mjs

            - name: Install Firefox browser test dependencies
              run: npm ci --prefix frontend && cd frontend && npx playwright install --with-deps firefox

            - name: Run Firefox browser tests
              working-directory: ./frontend
              run: npm run test:e2e

    frontend:
        name: Frontend Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Run linter
              working-directory: ./frontend
              run: npm run lint -- --max-warnings=0

            - name: Run tests
              working-directory: ./frontend
              run: npm test -- --run

            - name: Build
              working-directory: ./frontend
              run: npm run build

    services-health-check:
        name: Compose Deployment Checks
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        env:
            COMPOSE_PROJECT_NAME: socialanimal-ci
            DATABASE_VOLUME: socialanimal-ci_db_data
            DEV_DATABASE_VOLUME: socialanimal-ci-dev_db_data
            SMOKE_BASE_URL: http://127.0.0.1:3000
            SMOKE_ALLOW_WRITES: "1"

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Set up Docker
              uses: docker/setup-buildx-action@v3

            - name: Validate workflows
              run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color

            - name: Create disposable environment from production example
              run: |
                  node --input-type=module <<'JS'
                  import { readFileSync, writeFileSync } from "node:fs";
                  import { randomBytes } from "node:crypto";
                  let text = readFileSync("example.env", "utf8");
                  const values = {
                      SOCIALANIMAL_VERSION: "ci",
                      PUBLIC_URL: "http://127.0.0.1:3000",
                      POSTGRES_PASSWORD: randomBytes(32).toString("hex"),
                      JWT_SECRET: randomBytes(32).toString("hex"),
                      CREDENTIAL_ENCRYPTION_KEY: randomBytes(32).toString("hex"),
                  };
                  for (const [key, value] of Object.entries(values)) {
                      text = text.replace(new RegExp(`^${key}=.*$`, "m"), `${key}=${value}`);
                  }
                  writeFileSync(".env.build", text, { mode: 0o600 });
                  JS

            - name: Validate all Compose modes
              run: |
                  node scripts/validate-compose.mjs development .env.build
                  node scripts/validate-compose.mjs build .env.build
                  node scripts/validate-compose.mjs production .env.build
                  node scripts/validate-compose.mjs legacy .env.build

            - name: Build and start production-mode images
              run: docker compose --env-file .env.build -f build-docker-compose.yml up --build --wait --wait-timeout 180

            - name: Smoke-test built images
              run: |
                  docker compose --env-file .env.build -f build-docker-compose.yml exec -T backend wget -qO- http://127.0.0.1:4000/ready
                  node tests/deployment/compose-smoke.mjs

            - name: Start production Compose using the same prebuilt images and database
              run: |
                  docker compose --env-file .env.build -f build-docker-compose.yml down
                  docker compose --env-file .env.build -f docker-compose.yml up --no-build --pull never --wait --wait-timeout 180

            - name: Smoke-test production Compose
              run: node tests/deployment/compose-smoke.mjs

            - name: Smoke-test legacy Compose filename
              run: |
                  docker compose --env-file .env.build -f legacy-docker-compose.yml up --no-build --pull never --wait --wait-timeout 180
                  node tests/deployment/compose-smoke.mjs

            - name: Stop production services before testing development ports
              run: docker compose --env-file .env.build -f docker-compose.yml down

            - name: Start development Compose
              run: docker compose -p socialanimal-ci-dev --env-file .env.build -f dev-docker-compose.yml up --wait --wait-timeout 300

            - name: Smoke-test development Compose
              run: node tests/deployment/compose-smoke.mjs

            - name: Show service logs
              if: failure()
              run: |
                  docker compose --env-file .env.build -f docker-compose.yml logs --tail 100
                  docker compose -p socialanimal-ci-dev --env-file .env.build -f dev-docker-compose.yml logs --tail 100

            - name: Stop disposable test services
              if: always()
              run: |
                  docker compose --env-file .env.build -f docker-compose.yml down -v
                  docker compose -p socialanimal-ci-dev --env-file .env.build -f dev-docker-compose.yml down -v
