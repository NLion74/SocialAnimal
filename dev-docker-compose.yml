# Use: docker compose --env-file .env.dev -f dev-docker-compose.yml up --wait
services:
    db:
        image: postgres:16
        restart: unless-stopped
        env_file:
            - .env.dev
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-socialanimal}
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            - dev_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
                ]
            interval: 5s
            timeout: 2s
            retries: 20
            start_period: 5s
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

    setup:
        image: node:22-alpine
        working_dir: /app
        restart: "no"
        volumes:
            - ./backend:/app
            - dev_backend_modules:/app/node_modules
            - dev_backend_dist:/app/dist
        env_file:
            - .env.dev
        environment:
            NODE_ENV: development
            PORT: "4000"
        command: >
            sh -c "npm ci &&
                   npx prisma generate &&
                   npm run build &&
                   npm run database:setup"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

    backend:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - ./backend:/app
            - dev_backend_modules:/app/node_modules
            - dev_backend_dist:/app/dist
        env_file:
            - .env.dev
        command: ["npm", "run", "dev"]
        ports:
            - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
        environment:
            NODE_ENV: development
            PORT: "4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/ready"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 120s
        depends_on:
            db:
                condition: service_healthy
            setup:
                condition: service_completed_successfully
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

    frontend:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - ./frontend:/app
            - dev_frontend_modules:/app/node_modules
            - dev_frontend_next:/app/.next
        command: >
            sh -c "npm ci &&
                   npm run dev -- --hostname 0.0.0.0 --port 3000"
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        environment:
            NODE_ENV: development
            PORT: "3000"
            PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
            BACKEND_URL: "http://backend:4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 120s
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    dev_postgres_data:
    dev_backend_modules:
    dev_backend_dist:
    dev_frontend_modules:
    dev_frontend_next:

networks:
    app-network:
        driver: bridge
