services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-socialanimal}
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
                ]
            interval: 5s
            timeout: 2s
            retries: 20
            start_period: 5s
    backend:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - ./backend:/app
            - backend-modules:/app/node_modules
            - backend-build:/app/dist
        command: >
            sh -c "npm ci --fetch-retries=5 --fetch-retry-mintimeout=2000
            --fetch-retry-maxtimeout=30000 &&
            npx prisma generate &&
            npm run build && node dist/migrate.js &&
            npm run dev"
        ports:
            - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
        environment:
            NODE_ENV: development
            PORT: "4000"
            DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:postgres@db:5432/socialanimal}"
            JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
            GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
            GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
            GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
            PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3000}"
            CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY}"
            MIN_SYNC_INTERVAL_MINUTES: "${MIN_SYNC_INTERVAL_MINUTES:-15}"
            SYNC_CONCURRENCY: "${SYNC_CONCURRENCY:-3}"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/ready"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 120s
        depends_on:
            db:
                condition: service_healthy
    frontend:
        image: node:22-alpine
        working_dir: /app
        volumes:
            - ./frontend:/app
            - frontend-modules:/app/node_modules
            - frontend-build:/app/.next
        command: >
            sh -c "npm ci --fetch-retries=5 --fetch-retry-mintimeout=2000
            --fetch-retry-maxtimeout=30000 && npm run dev"
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        environment:
            NODE_ENV: development
            PORT: "3000"
            PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3000}"
            BACKEND_URL: "http://backend:4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 120s
        depends_on:
            backend:
                condition: service_healthy
volumes:
    db-data:
        name: ${DEV_DATABASE_VOLUME:-socialanimal_dev_db_data}
    backend-modules:
        name: ${COMPOSE_PROJECT_NAME:-socialanimal_dev}_backend_modules
    frontend-modules:
        name: ${COMPOSE_PROJECT_NAME:-socialanimal_dev}_frontend_modules
    backend-build:
        name: ${COMPOSE_PROJECT_NAME:-socialanimal_dev}_backend_build
    frontend-build:
        name: ${COMPOSE_PROJECT_NAME:-socialanimal_dev}_frontend_build
