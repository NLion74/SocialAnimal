# Use: docker compose --env-file .env.dev -f dev-docker-compose.yml up --wait
x-logging: &service-logging
    driver: local
    options:
        max-size: "10m"
        max-file: "3"

services:
    db:
        logging: *service-logging
        image: postgres:16
        restart: unless-stopped
        env_file:
            - .env.dev
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-socialanimal}
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            - ./docker_data/dev/postgres:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
                ]
            interval: 5s
            timeout: 2s
            retries: 20
            start_period: 5s
    setup:
        logging: *service-logging
        build:
            context: ./backend
        image: socialanimal-backend-dev
        restart: "no"
        env_file:
            - .env.dev
        environment:
            NODE_ENV: development
            PORT: "4000"
        command: ["node", "dist/setup-database.js"]
        depends_on:
            db:
                condition: service_healthy
    backend:
        logging: *service-logging
        build:
            context: ./backend
        image: socialanimal-backend-dev
        working_dir: /app
        env_file:
            - .env.dev
        command: ["node", "dist/index.js"]
        ports:
            - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
        environment:
            NODE_ENV: development
            PORT: "4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/ready"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 120s
        depends_on:
            db:
                condition: service_healthy
            setup:
                condition: service_completed_successfully
    frontend:
        logging: *service-logging
        build:
            context: ./frontend
        image: socialanimal-frontend-dev
        working_dir: /app
        command: ["node", "server.js"]
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        environment:
            NODE_ENV: development
            PORT: "3000"
            PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
            BACKEND_URL: "http://backend:4000"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 120s
        depends_on:
            backend:
                condition: service_healthy
