# Compatibility filename: runs the same prebuilt production services.
x-backend-environment: &backend-environment
    NODE_ENV: production
    PORT: "4000"
    LOG_LEVEL: "${LOG_LEVEL:-info}"
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY}
    PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    MIN_SYNC_INTERVAL_MINUTES: ${MIN_SYNC_INTERVAL_MINUTES:-15}
    PRIVATE_PROVIDER_HOSTS: ${PRIVATE_PROVIDER_HOSTS:-}
    SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-3}
    SMTP_HOST: "${SMTP_HOST:-}"
    SMTP_PORT: "${SMTP_PORT:-587}"
    SMTP_SECURE: "${SMTP_SECURE:-false}"
    SMTP_REQUIRE_TLS: "${SMTP_REQUIRE_TLS:-true}"
    SMTP_USER: "${SMTP_USER:-}"
    SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    SMTP_FROM: "${SMTP_FROM:-}"

services:
    db:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-socialanimal}
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 5s

    setup:
        image: nlion/socialanimal-backend:${SOCIALANIMAL_VERSION:?Set SOCIALANIMAL_VERSION to a release tag}
        restart: "no"
        environment: *backend-environment
        command: ["node", "dist/setup-database.js"]
        depends_on:
            db:
                condition: service_healthy

    backend:
        image: nlion/socialanimal-backend:${SOCIALANIMAL_VERSION:?Set SOCIALANIMAL_VERSION to a release tag}
        restart: unless-stopped
        environment: *backend-environment
        depends_on:
            db:
                condition: service_healthy
            setup:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/ready"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

    frontend:
        image: nlion/socialanimal-frontend:${SOCIALANIMAL_VERSION:?Set SOCIALANIMAL_VERSION to a release tag}
        restart: unless-stopped
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        environment:
            NODE_ENV: production
            PORT: "3000"
            PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

volumes:
    db_data:
        name: ${DATABASE_VOLUME:-socialanimal_legacy_db_data}
