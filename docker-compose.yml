# Use: docker compose -f docker-compose.yml up --wait
services:
    db:
        image: postgres:16
        restart: unless-stopped
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-socialanimal}
        volumes:
            - release_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 5s
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

    setup:
        image: nlion/socialanimal-backend:${SOCIALANIMAL_VERSION:?Set SOCIALANIMAL_VERSION to a release tag}
        restart: "no"
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: "4000"
        command: ["node", "dist/setup-database.js"]
        depends_on:
            db:
                condition: service_healthy
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

    backend:
        image: nlion/socialanimal-backend:${SOCIALANIMAL_VERSION:?Set SOCIALANIMAL_VERSION to a release tag}
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: "4000"
        depends_on:
            db:
                condition: service_healthy
            setup:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/ready"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

    frontend:
        image: nlion/socialanimal-frontend:${SOCIALANIMAL_VERSION:?Set SOCIALANIMAL_VERSION to a release tag}
        restart: unless-stopped
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        environment:
            NODE_ENV: production
            PORT: "3000"
            BACKEND_URL: http://backend:4000
            PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
        networks:
            - app-network
        logging:
            driver: local
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    release_postgres_data:

networks:
    app-network:
        driver: bridge
